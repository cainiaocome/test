name: Qwen3 repo reranker

on:
  push:
    branches:
      - qwen3-reranker-repo-ranking
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-itsdangerous:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-reranker-0.6b-v1

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Clone itsdangerous
        run: git clone --depth 1 https://github.com/pallets/itsdangerous.git "$RUNNER_TEMP/itsdangerous"

      - name: Rank file paths
        run: |
          python scripts/rank_repo.py "$RUNNER_TEMP/itsdangerous" \
            --include "README.md" \
            --include "pyproject.toml" \
            --include "uv.lock" \
            --include "src/**" \
            --top 20 \
            --max-length 8192 \
            --batch-size 4 \
            --output qwen3-reranker-results.json

      - name: Validate path-only result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("qwen3-reranker-results.json").read_text())
          results = data["results"]

          assert data["mode"] == "path-only"
          assert data["max_length"] == 8192
          assert data["repository_path_count"] >= 40, data["repository_path_count"]
          assert 10 <= data["candidate_count"] <= 20, data["candidate_count"]
          assert len(results) == data["candidate_count"]
          assert all(0.0 <= row["score"] <= 1.0 for row in results)
          assert all(
              results[i]["score"] >= results[i + 1]["score"]
              for i in range(len(results) - 1)
          )

          paths = {row["path"] for row in results}
          assert "src/itsdangerous/serializer.py" in paths
          assert "src/itsdangerous/signer.py" in paths
          assert "uv.lock" in paths

          print("Ranking:")
          for row in results:
              print(f'{row["score"]:.6f}  {row["path"]}')
          PY

      - name: Upload ranking
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-reranker-path-only-results
          path: qwen3-reranker-results.json
